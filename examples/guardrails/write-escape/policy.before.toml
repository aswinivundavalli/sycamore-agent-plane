# A realistic repository policy: protected paths, forbidden commands, a size
# cap, no deleting tests. It still lets an agent write anywhere on the host
# with a shell command, because none of these rules can see such a write.
[paths]
forbidden = [".github/**", "secrets/**"]

[diff]
max_lines = 400
forbid_test_deletion = true

[commands]
forbidden = ["curl", "wget"]
